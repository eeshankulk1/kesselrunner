    <rect x="948" y="127" width="131" height="1" fill="url(#streak)" opacity="0.52"/>
    <rect x="1166" y="377" width="87" height="1" fill="url(#streak)" opacity="0.54"/>
    <rect x="232" y="190" width="95" height="1" fill="url(#streak)" opacity="0.56"/>
    <rect x="877" y="76" width="159" height="1" fill="url(#streak)" opacity="0.34"/>
