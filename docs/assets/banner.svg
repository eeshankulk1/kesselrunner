<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
  <title id="t">kesselrunner</title>
  <desc id="d">You, the captain, talk to the Millennium Falcon, the supervisor. Its crew each work in a worktree, a tmux tab and a PR, and their runs land on main through the merge queue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#121c36"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bae6fd" stop-opacity="0"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="streakb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="1" stop-color="#f0f9ff"/>
    </linearGradient>
    <radialGradient id="hull" cx=".45" cy=".42" r=".7">
      <stop offset="0" stop-color="#eef2f6"/>
      <stop offset=".7" stop-color="#c3cbd6"/>
      <stop offset="1" stop-color="#8f9aab"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .label { font-size: 15px; fill: #cbd5e1; font-weight: 600; }
      .small { font-size: 13px; fill: #94a3b8; }
      .name { font-size: 12px; fill: #7dd3fc; font-weight: 600; }
      .pill { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
      .wire { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 6 6; }
      .solid { stroke: #64748b; stroke-width: 2; fill: none; }
      .crew { fill: #38bdf8; }
      .seam { stroke: #7b8799; stroke-width: 1; fill: none; }
      .plate { fill: #aab4c2; stroke: #7b8799; stroke-width: .8; }
    </style>
  </defs>

  <rect width="1280" height="440" rx="20" fill="url(#bg)"/>

