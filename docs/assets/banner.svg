  <!-- name and tagline -->
  <text x="64" y="96" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-1">kesselrunner</text>
  <text x="66" y="136" font-size="24" fill="#94a3b8">Talk to the Falcon. The crew makes the Kessel Run.</text>

  <!-- you, the captain -->
  <g transform="translate(96 290)">
    <circle cx="0" cy="-26" r="16" fill="#f8fafc"/>
    <path d="M-26 22 a26 26 0 0 1 52 0 z" fill="#f8fafc"/>
    <text x="0" y="50" text-anchor="middle" class="label">you</text>
    <text x="0" y="70" text-anchor="middle" class="small">the captain</text>
  </g>
  <g transform="translate(138 200)">
    <rect width="120" height="40" rx="12" fill="#f8fafc"/>
    <path d="M16 40 L8 56 L32 40 z" fill="#f8fafc"/>
    <text x="60" y="26" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="600">punch it</text>
  </g>
  <path class="solid" d="M140 290 L292 290" marker-end="url(#arrow)"/>

  <!-- the Millennium Falcon, from above, nose to the right -->
  <g transform="translate(400 280)">
    <!-- docking ports -->
    <rect x="-16" y="-90" width="22" height="14" rx="3" fill="#aab4c2" stroke="#6b7789"/>
    <rect x="-38" y="74" width="22" height="14" rx="3" fill="#aab4c2" stroke="#6b7789"/>
    <!-- cockpit arm and tube, starboard side -->
    <path d="M6 66 L44 70 L44 92 L0 84 z" fill="#b8c1cd" stroke="#6b7789"/>
    <rect x="18" y="70" width="80" height="24" rx="12" fill="url(#hull)" stroke="#6b7789" stroke-width="1.2"/>
    <path d="M86 71.5 a11 10.5 0 0 1 0 21 z" fill="#1e293b"/>
    <path d="M88 73 L96 82 L88 91 M92 76 L92 88" stroke="#64748b" stroke-width="1" fill="none"/>
    <line x1="30" y1="82" x2="80" y2="82" class="seam"/>
    <!-- hull: saucer and the two mandibles -->
    <path d="M64 -48 L125 -40 L127 -12 L72 -10 A10 10 0 0 0 72 10 L127 12 L125 40 L64 48 A80 80 0 1 1 64 -48 z" fill="url(#hull)" stroke="#6b7789" stroke-width="1.5"/>
    <!-- engine glow along the back -->
    <path d="M-58.3 45.6 A75 75 0 0 1 -58.3 -45.6" stroke="#38bdf8" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M-58.3 45.6 A75 75 0 0 1 -58.3 -45.6" stroke="#e0f2fe" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- mandible plating -->
    <g class="seam">
      <path d="M78 -26 L124 -26 M78 26 L124 26 M98 -40 L98 -11 M98 11 L98 40 M112 -40 L112 -11 M112 11 L112 40"/>
      <circle r="52"/><circle r="27"/>
      <line x1="20.7" y1="17.4" x2="59.0" y2="49.5"/><line x1="13.5" y1="23.4" x2="38.5" y2="66.7"/><line x1="4.7" y1="26.6" x2="13.4" y2="75.8"/><line x1="-4.7" y1="26.6" x2="-13.4" y2="75.8"/><line x1="-13.5" y1="23.4" x2="-38.5" y2="66.7"/><line x1="-20.7" y1="17.4" x2="-59.0" y2="49.5"/><line x1="-25.4" y1="9.2" x2="-72.4" y2="26.3"/><line x1="-27.0" y1="0.0" x2="-77.0" y2="0.0"/><line x1="-25.4" y1="-9.2" x2="-72.4" y2="-26.3"/><line x1="-20.7" y1="-17.4" x2="-59.0" y2="-49.5"/><line x1="-13.5" y1="-23.4" x2="-38.5" y2="-66.7"/><line x1="-4.7" y1="-26.6" x2="-13.4" y2="-75.8"/><line x1="4.7" y1="-26.6" x2="13.4" y2="-75.8"/><line x1="13.5" y1="-23.4" x2="38.5" y2="-66.7"/><line x1="20.7" y1="-17.4" x2="59.0" y2="-49.5"/>
    </g>
    <g class="plate"><rect x="-29.2" y="53.8" width="16" height="9" rx="1" transform="rotate(110 -21.2 58.3)"/><rect x="-61.5" y="14.8" width="14" height="10" rx="1" transform="rotate(160 -54.5 19.8)"/><rect x="-65.4" y="-24.5" width="18" height="8" rx="1" transform="rotate(200 -56.4 -20.5)"/><rect x="-28.5" y="-63.7" width="14" height="9" rx="1" transform="rotate(250 -21.5 -59.2)"/><rect x="23.0" y="-54.2" width="12" height="8" rx="1" transform="rotate(300 29.0 -50.2)"/><rect x="-33.3" y="24.8" width="10" height="7" rx="1" transform="rotate(135 -28.3 28.3)"/><rect x="-35.7" y="-33.2" width="12" height="7" rx="1" transform="rotate(225 -29.7 -29.7)"/><rect x="5.4" y="-41.6" width="10" height="6" rx="1" transform="rotate(285 10.4 -38.6)"/><rect x="13.8" y="50.5" width="12" height="8" rx="1" transform="rotate(70 19.8 54.5)"/>
      <rect x="84" y="-36" width="10" height="7" rx="1"/><rect x="104" y="30" width="6" height="7" rx="1"/>
    </g>
    <!-- center turret and the hatches -->
    <circle r="18" fill="#9aa5b5" stroke="#6b7789"/>
    <circle r="9" fill="#4b5563"/>
    <path d="M6 -3 L22 -3 M6 3 L22 3" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/>
    <!-- top dish, forward and to port -->
    <g transform="translate(40 -36) rotate(-20)">
      <rect x="-4" y="-2" width="8" height="10" fill="#6b7789"/>
      <rect x="-14" y="-14" width="28" height="13" rx="3" fill="#d6dce4" stroke="#6b7789"/>
      <line x1="0" y1="-14" x2="0" y2="-1" stroke="#6b7789"/>
    </g>
    <text x="22" y="122" text-anchor="middle" class="label">the Falcon</text>
    <text x="22" y="142" text-anchor="middle" class="small">the supervisor</text>
  </g>

  <!-- crew lines -->
  <path class="wire" d="M534 280 C 590 280, 600 200, 650 200"/>
  <path class="wire" d="M534 280 L650 280"/>
  <path class="wire" d="M534 280 C 590 280, 600 360, 650 360"/>

  <!-- the crew: one per task -->
  <g transform="translate(670 200)">
    <circle cx="0" cy="-8" r="8" class="crew"/><path d="M-12 14 a12 12 0 0 1 24 0 z" class="crew"/>
    <text x="0" y="32" text-anchor="middle" class="name">luke</text>
    <rect x="26" y="-17" width="110" height="30" rx="15" class="pill"/>
    <text x="81" y="3" text-anchor="middle" class="label">worktree</text>
  </g>
  <g transform="translate(670 280)">
    <circle cx="0" cy="-8" r="8" class="crew"/><path d="M-12 14 a12 12 0 0 1 24 0 z" class="crew"/>
    <text x="0" y="32" text-anchor="middle" class="name">leia</text>
    <rect x="26" y="-17" width="110" height="30" rx="15" class="pill"/>
    <text x="81" y="3" text-anchor="middle" class="label">tmux tab</text>
  </g>
  <g transform="translate(670 360)">
    <circle cx="0" cy="-8" r="8" class="crew"/><path d="M-12 14 a12 12 0 0 1 24 0 z" class="crew"/>
    <text x="0" y="32" text-anchor="middle" class="name">han</text>
    <rect x="26" y="-17" width="110" height="30" rx="15" class="pill"/>
    <text x="81" y="3" text-anchor="middle" class="label">PR</text>
  </g>

  <!-- into the merge queue -->
  <path class="solid" d="M808 200 C 870 200, 880 280, 930 280"/>
  <path class="solid" d="M808 280 L930 280"/>
  <path class="solid" d="M808 360 C 870 360, 880 280, 930 280"/>
  <g transform="translate(930 280)">
    <rect x="0" y="-22" width="130" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="65" y="5" text-anchor="middle" class="label">merge queue</text>
  </g>
  <path class="solid" d="M1060 280 L1114 280" marker-end="url(#arrow)"/>

  <!-- main: the run made -->
  <g transform="translate(1160 280)">
    <circle r="28" fill="#22c55e"/>
    <path d="M-12 1 L-3 10 L13 -8" stroke="#0b1120" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="56" text-anchor="middle" class="label">main</text>
    <text x="0" y="76" text-anchor="middle" class="small">run made</text>
  </g>
</svg>
